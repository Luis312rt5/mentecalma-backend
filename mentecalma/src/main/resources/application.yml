server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: mentecalma

  datasource:
    url: jdbc:postgresql://localhost:5432/mentecalma_db
    username: user_luis
    password: 2112
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  cache:
    type: simple

jwt:
  secret: "MenteCalma2026SuperSecretKeyForJWTSigningMustBe256BitsLong!!"
  expiration-ms: 86400000

logging:
  level:
    com.mentecalma: DEBUG
    org.springframework.security: INFO